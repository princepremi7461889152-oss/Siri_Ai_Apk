
name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -e
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {split($2,v,"."); print v[1]; exit}')

          if [ -z "$JAVA_MAJOR" ] || [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java 17 or higher is required."
            exit 1
          fi

          echo "Java environment verified."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -e

          if [ ! -f "./debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          test -s ./debug.keystore
          echo "Debug keystore is ready."

      - name: Build the debug APK
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          else
            gradle :app:assembleDebug --stacktrace --no-daemon
          fi

      - name: Verify the APK
        shell: bash
        run: |
          set -e

          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: APK not found or empty: $EXPECTED_APK"
            echo "Searching for generated APK files..."
            find . -type f -name "*.apk" -print || true
            exit 1
          fi

          echo "APK verified: $EXPECTED_APK"
          echo "Size: $(stat -c%s "$EXPECTED_APK") bytes"
          sha256sum "$EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: app/build/outputs/apk/debug/app-debug.apk
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -e

          RELEASE_TAG="debug-apk-build-${RUN_NUMBER}-${RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${RUN_NUMBER}"

          RELEASE_NOTES=$(cat <<EOF
          ### Automated Debug APK Build

          - Type: Debug APK for testing
          - Builder: GitHub Actions
          - Run Number: ${RUN_NUMBER}
          - Run Attempt: ${RUN_ATTEMPT}
          - Commit SHA: ${COMMIT_SHA}
          - Signing: Temporary debug keystore
          - Usage: Testing only; not a Play Store production release.
          EOF
          )

          if ! command -v gh >/dev/null 2>&1; then
            echo "GitHub CLI is unavailable."
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "Error: APK file not found."
            exit 1
          fi

          echo "Publishing release: $RELEASE_TAG"

          gh release create "$RELEASE_TAG" "$APK_PATH" \
            --repo "$REPOSITORY" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "$COMMIT_SHA"

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          {
            echo "## Debug APK Build Result"
            echo ""
            echo "- Build run: ${RUN_NUMBER}"
            echo "- Run attempt: ${RUN_ATTEMPT}"
            echo "- Actions artifact: \`app-debug-apk\`"
            echo ""

            if [ "$RELEASE_OUTCOME" = "success" ]; then
              DIRECT_URL="https://github.com/${REPOSITORY}/releases/download/debug-apk-build-${RUN_NUMBER}-${RUN_ATTEMPT}/app-debug.apk"
              echo "### GitHub Release published"
              echo ""
              echo "[Download app-debug.apk](${DIRECT_URL})"
            else
              echo "### GitHub Release was not published"
              echo ""
              echo "If the APK build succeeded, download it from the Actions artifact."
              echo "Check the Publish APK to GitHub Releases step logs for the error."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
